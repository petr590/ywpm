[package]
name = "ywpm"
version = "0.1.1"
edition = "2024"

[dependencies]
yaml_serde = "0.10"
itertools  = "0.15"
once_cell  = "1"
walkdir    = "2"
chrono     = "0.4"
regex      = "1"
indoc      = "2"
rand       = "0.10"
serde      = { version = "1",    features = ["derive", "rc"] }
nix        = { version = "0.31", features = ["poll", "signal"] }
phf        = { version = "0.14", features = ["macros"] }


[[bin]]
name = "ywpm-daemon"
path = "src/server/main.rs"

[[bin]]
name = "ywpm"
path = "src/client/main.rs"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "socket_benches"
harness = false
