[package]
name = "ywpm"
version = "0.1.1"
edition = "2024"

[dependencies]
chrono     = "0.4"
indoc      = "2"
itertools  = "0.15"
nix        = { version = "0.31", features = ["poll", "signal"] }
once_cell  = "1"
phf        = { version = "0.14", features = ["macros"] }
rand       = "0.10"
regex      = "1"
serde      = { version = "1", features = ["derive", "rc"] }
serde_with = { version = "3.22", features = ["chrono"] }
walkdir    = "2"
yaml_serde = "0.10"


[[bin]]
name = "ywpm-daemon"
path = "src/daemon/main.rs"

[[bin]]
name = "ywpm"
path = "src/client/main.rs"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "socket_benches"
harness = false
